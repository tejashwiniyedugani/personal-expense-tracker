# ===================================================================
# Personal Expense Tracker - Application Configuration
# Ideal for B.Tech Full Stack Lab Examination & Viva Demonstration
# ===================================================================

server.port=8080

# Application Name
spring.application.name=personal-expense-tracker

# -------------------------------------------------------------------
# Primary Database: H2 Embedded Database (File-Persistent & Multi-Connection)
# Stores data under ./data/expensedb so data persists across restarts
# AUTO_SERVER=TRUE enables concurrent connections without file locking
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/expensedb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# OPTIONAL: MySQL Database Configuration Profile
# Run with: --spring.profiles.active=mysql
# -------------------------------------------------------------------

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
